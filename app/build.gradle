def releaseKeystorePath = System.getenv("JOURNAL_HRT_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("JOURNAL_HRT_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("JOURNAL_HRT_KEY_ALIAS")
def releaseKeyPassword = System.getenv("JOURNAL_HRT_KEY_PASSWORD")
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.isBlank() }

android {
    ndkVersion "29.0.14206865"
    compileSdk 37

    defaultConfig {
        applicationId "io.github.chenyuqing2005.journal"
        minSdk 26
        targetSdk 37
        versionCode 1100919
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            vcsInfo {
                // F-Droid reproducible builds: the embedded VCS info differs between
                // build environments, breaking byte-identical verification.
                include = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig = false
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    splits {
        abi {
            // Per-ABI APKs only when the CI sets ENABLE_SPLITS=true; local and
            // debug builds stay split-free so assembleDebug produces one APK.
            enable System.getenv("ENABLE_SPLITS") == "true"
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    dependenciesInfo {
        includeInApk = false
    }
    
    namespace "com.isaakhanimann.journal"
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

